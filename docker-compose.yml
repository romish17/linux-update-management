services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: linux-update-backend
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ~/.ssh:/root/.ssh:ro
    environment:
      - FLASK_ENV=production
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/data/servers.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - TZ=Europe/Paris
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: linux-update-frontend
    ports:
      - "3000:80"
    environment:
      - TZ=Europe/Paris
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
